<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Productos</title>
    <link rel="stylesheet" href="../Css/main.css">
    <link rel="stylesheet" href="../Css/layout.css">
    <link rel="stylesheet" href="../Css/components.css">
    <link rel="stylesheet" href="../Css/animations.css">
</head>
<body>

    <header class="site-header">
        <div class="logo">
            <h1>EcoMarket</h1>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="products.html" class="active">Productos</a></li>
                <li><a href="sobre-nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="header-actions">
            <a href="#" class="search-btn">Búsqueda</a>
            <a href="#" class="cart-btn">Carrito</a>
        </div>
    </header> 

    <main class="main-content catalog-layout">
        <aside class="filters-sidebar">
            <h3>Filtrar por Categoría</h3>
            
            <div class="filter-group">
                <input type="radio" id="cat-todos" name="categoria" checked>
                <label for="cat-todos" class="filter-label">Todos</label>

                <input type="radio" id="cat-cuidado" name="categoria">
                <label for="cat-cuidado" class="filter-label">Cuidado Personal</label>

                <input type="radio" id="cat-hogar" name="categoria">
                <label for="cat-hogar" class="filter-label">Hogar y Cocina</label>
            </div>
        </aside>
        <section class="catalog-section">
            <div class="catalog-top-bar">
                <h2>Nuestro Catálogo</h2>
            </div>
            <div class="products-grid">

                <article class="product-card item-cuidado">
                    <span class="stock-badge">En stock</span>
                    <img src="../img/products/product1.jpg" alt="Cepillo de bambú">
                    <h4>Cepillo de Bambú</h4>
                    <p class="product-price">$15.000</p>
                    <a href="#" class="btn-details">Ver más</a>
                </article>

                <article class="product-card item-hogar">
                    <span class="stock-badge">En stock</span>
                    <img src="../img/products/product2.jpg" alt="Botella reutilizable">
                    <h4>Botella Térmica Inoxidable</h4>
                    <p class="product-price">$45.000</p>
                    <a href="#" class="btn-details">Ver más</a>
                </article>
            </div>

            <nav class="pagination">
                <a href="#" class="page-link">Anterior</a>
                <a href="#" class="page-link">1</a>
                <a href="#" class="page-link">2</a>
                <a href="#" class="page-link">Siguiente</a>
            </nav>
        </section>

    </main>

</body>
</html>
